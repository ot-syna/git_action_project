name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Критерий 3: Создание .env файла из секретов (без кодировки BOM)
      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file from GitHub Secrets..."
          $envContent = "DB_USER=${{ secrets.DB_USER }}`nDB_PASSWORD=${{ secrets.DB_PASSWORD }}`nDB_NAME=${{ secrets.DB_NAME }}"
          [System.IO.File]::WriteAllText("$PWD\.env", $envContent)
          Write-Host ".env file created successfully"
          Get-Content .env | ForEach-Object { $_ -replace '=.*', '=***' }

      # Критерий 2: Сборка и запуск Docker Compose
      - name: Deploy with Docker Compose
        run: |
          docker compose down --remove-orphans 2>$null
          docker compose up -d --build
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 15
          docker compose ps -a

      - name: Verify containers are running
        run: |
          docker compose ps -a
          $running = docker compose ps --status running --services
          Write-Host "Running services: $running"
          if ($running -match "app" -and $running -match "db") {
            Write-Host "All containers are running"
          } else {
            Write-Host "Some containers failed to start"
            docker compose logs
            exit 1
          }

      # Критерий 4: Тестирование приложения, БД и сверка данных
      - name: Run application tests
        run: |
          Write-Host "1. Testing frontend and backend API..."
          $front = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing
          if ($front.StatusCode -ne 200) { exit 1 }

          $apiItems = Invoke-RestMethod -Uri "http://localhost:8080/api/items"
          $webCount = $apiItems.Count
          Write-Host "Web API count: $webCount"

          Write-Host "2. Testing data consistency between DB and Web API..."
          $dbRaw = (docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;") -join ""
          $dbCount = [int]($dbRaw.Trim())

          Write-Host "Database count: $dbCount"

          if ($dbCount -eq $webCount -and $dbCount -gt 0) {
            Write-Host "Data consistency test passed"
          } else {
            Write-Host "Data consistency test failed"
            exit 1
          }

      # Формирование отчета и логов
      - name: Create test report
        if: always()
        run: |
          @"
          # Deployment Test Report
          - Date: $(Get-Date)
          - Application: Healthy
          - Database: Connected
          - Containers: Running
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8
          docker images | Out-File -FilePath docker-images.txt -Encoding utf8
          docker ps -a | Out-File -FilePath docker-ps.txt -Encoding utf8

      # Критерий 3: Сохранение артефактов
      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30
