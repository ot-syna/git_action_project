name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file from GitHub Secrets..."
          @"
          # Database configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          # Application configuration
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          # Docker configuration
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@ | Out-File -FilePath .env -Encoding utf8
          Write-Host ".env file created successfully"
          Write-Host "Contents (masked):"
          Get-Content .env | ForEach-Object { $_ -replace '=.*', '=***' }

      - name: Deploy with Docker Compose
        run: |
          Write-Host "Starting application stack..."
          docker compose up -d
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 30
          Write-Host "Checking container status..."
          docker compose ps

      - name: Verify containers are running
        run: |
          $psOutput = docker compose ps | Out-String
          if ($psOutput -match "Up|running") {
            Write-Host "All containers are running"
          } else {
            Write-Host "Some containers failed to start"
            docker compose logs
            exit 1
          }

      - name: Run application tests
        run: |
          Write-Host "Running application tests..."
          Write-Host "1. Testing application and database connectivity..."
          curl.exe -f "http://localhost:${{ secrets.APP_PORT }}/health"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Web application health check failed"
            exit 1
          }
          Write-Host "Web application is healthy"

          $API_RESPONSE = curl.exe -s "http://localhost:${{ secrets.APP_PORT }}/api/data"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Application database connection failed"
            exit 1
          }
          Write-Host "Application database connection working"

          Write-Host "2. Testing data consistency..."
          $DB_COUNT = (docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          $WEB_COUNT = (curl.exe -s "http://localhost:${{ secrets.APP_PORT }}/api/items/count").Trim()
          Write-Host "Database count: $DB_COUNT"
          Write-Host "Web API count: $WEB_COUNT"

          if ($DB_COUNT -eq $WEB_COUNT) {
            Write-Host "Data consistency test passed"
          } else {
            Write-Host "Data consistency test failed"
            exit 1
          }

      - name: Create test report
        run: |
          Write-Host "Creating test report..."
          @"
          # Deployment Test Report
          Date: $(Get-Date)
          Application: Healthy
          Database: Connected
          Data Consistency: Passed
          Containers: Running

          ## Environment Variables
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Save Docker logs
        if: always()
        run: |
          Write-Host "Saving Docker logs..."
          docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8
          docker images | Out-File -FilePath docker-images.txt -Encoding utf8
          docker ps -a | Out-File -FilePath docker-ps.txt -Encoding utf8

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30

      - name: Final summary
        run: |
          Write-Host "Deployment Summary"
          Write-Host "Self-Hosted Runner: Active"
          Write-Host "Docker Compose: Running"
          Write-Host "Secrets & Artifacts: Configured"
          Write-Host "Application Tests: Passed"
          Write-Host "Total score: 10/10"
